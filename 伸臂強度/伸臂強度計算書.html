<style>

body{background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}

.sub{font-size:12px;opacity:.75}
.btns{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:5px;cursor:pointer}

<script>
/* =========================================================
   伸臂強度計算書 — 依「移動式起重機構造規格」及 JIS B 8821 之計算方法
   單位：長度 cm、力 kgf、應力 kgf/cm²（荷重性能表之伸臂長、作業半徑為 m）
   重心位置兩種來源：
     STEP 1 選擇機具：資料庫機具（oem：原廠表 2 之 L、ℓ0、ℓi，鎖定）或自行計算
     （est：各部位置以伸臂最底端旋轉中心為基準點，依伸出比例推算，ℓ = x − x斷面）
     STEP 2 單頁顯示全部輸入與計算結果
   ========================================================= */
const LET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const secName = k => LET[k] + '-' + LET[k];
const boomName = k => `伸臂(${k + 1})`;
const RAD = Math.PI / 180;
const STORE_KEY = 'boomStrengthCalc.v1';

const { MACHINES, dataURA506WY, dataBlank, SELF_DESIGN } = window.BoomLib;   // 機具資料庫：boom-db.js
/* 資料庫機具：原廠外觀尺寸、重量、重心距離、荷重點為鎖定欄位 */
const LOCK_KEYS = ['shape', 'booms', 'items', 'stages'];
const isDb = () => !!MACHINES[S.src];
const CASE_CHART = () => !!window.CASE_ID && S.src === 'self';   // 荷重性能表跟隨主控台 S1-3
const CHART_RO = () => isDb() || CASE_CHART();
const locked = path => (isDb() && (/^(booms|items|stages)\./.test(path) || path === 'project.model'))
  || (CASE_CHART() && /^stages\.\d+\.(len|rows)/.test(path))
  || (/^booms\.\d+\.sec\./.test(path) && NOCHART());   // 無荷重表：斷面於主控台 S1-3 輸入

function baseState() {
  const m = dataURA506WY();
  return {
    src: null, step: 1, geoMode: 'oem',
    project: { title: '', model: '', no: '', author: '', date: new Date().toISOString().slice(0, 10) },
    design: m.design, chart: { title: '吊升荷重表', radii: '' },
    shape: m.shape, booms: m.booms, items: m.items, stages: m.stages, est: m.est,
    ui: { det: { s: 0, r: 0, k: 0 } }
  };
}
function fillGeo(st) {   // 補齊表 2 結構（空白範本用）
  st.stages.forEach(s => { if (!s.geo || s.geo.length !== st.booms.length) s.geo = st.booms.map(() => ({ L: null, l0: null, li: st.items.map(() => null) })); });
}
function newState(m, src, geoMode, model) {
  const keep = S ? S.project : {}, b = baseState();
  const s = Object.assign(b, m, { src, step: 2, geoMode });
  s.project = { ...b.project, ...m.project, author: (keep && keep.author) || '', date: (keep && keep.date) || b.project.date };
  if (model != null) s.project.model = model;
  s.chart = { title: '吊升荷重表', radii: '' };
  fillGeo(s);
  return s;
}
/* STEP 1 → 資料庫機具：外觀尺寸、重量、重心距離、荷重點全部帶入原廠資料 */
function pickMachine(id) { S = newState(MACHINES[id].data(), id, 'oem'); }
/* STEP 1 → 自行計算：重心依伸臂長度推算（實測估算模式），其他數值使用者填寫；可選範本 */
function startSelf(tpl) {
  const m = MACHINES[tpl] ? MACHINES[tpl].data() : dataBlank();
  S = newState(m, 'self', 'est', MACHINES[tpl] ? m.project.model + '（自行計算）' : '');
  Object.assign(S.design, SELF_DESIGN);
}
/* 斷面位置預設值：A-A 距旋轉中心 100 cm；第 k 節斷面位於前一節頭端內側，扣除擋板：
   x斷面(k) = X(k−1) − (n − k) × 擋板 10 cm（例 5 節、X = 250/500/750/1000/1250 → 100/210/470/730/990） */
const STOP_PLATE = 10;
function xsecDefault(X, k, n) { return k ? X[k - 1] - (n - k) * STOP_PLATE : 100; }
/* 舊版預設值（x斷面 = 前一節頭端，未扣擋板）改為新預設值；使用者自行輸入之其他值保留 */
function fixOldXsec(E) {
  if (!E || !Array.isArray(E.X) || !Array.isArray(E.Xsec)) return;
  const n = E.Xsec.length;
  for (let k = 1; k < n; k++) if (Number.isFinite(E.X[k - 1]) && E.Xsec[k] === E.X[k - 1]) E.Xsec[k] = xsecDefault(E.X, k, n);
}
/* 頂端滑輪銷位置 Xpin（全伸，自旋轉中心起算）＝ 最大伸臂長度（最末節伸臂頭端 X）；不另行輸入 */
function xpinOf(E) { return E && Array.isArray(E.X) && E.X.length ? Number(E.X[E.X.length - 1]) : NaN; }
function fixXpin(E) { if (E) { delete E.XpinOv; E.Xpin = xpinOf(E); } }
function migrate(o) {
  const b = baseState();
  const S2 = Object.assign(b, o);

  const out = [];
  for (let s = 0; s < S.stages.length; s++) {
    const st = S.stages[s], T = C.eff.tables[s], wind = C.res[s].wind;
    if (!isNum(st.len) || st.len <= 0 || !T[0].active) return null;
    const W = [];
    for (let i = 0; i * LIM_DR <= st.len + 1e-9; i++) {
      const th = Math.acos(Math.min(1, Math.max(-1, (i * LIM_DR + rOff) / st.len))) / RAD;
      const u = w => rowU(rowCalc(T, wind, C.geo, items, w, th).secs);
      if (!(u(0) <= UT)) { W.push(0); continue; }
      let lo = 0, hi = Wtop;
      if (u(hi) <= UT) { W.push(Math.floor(hi)); continue; }
      while (hi - lo > 1) { const m = (lo + hi) / 2; if (u(m) <= UT) lo = m; else hi = m; }
      W.push(Math.floor(lo));
    }
    out.push({ len: st.len, W });
  }
  return { dR: LIM_DR, stages: out };
}

/* ---------------- 無荷重性能表：依斷面強度反算荷重點 ----------------
   主控台 S1 選「沒有荷重性能表」時，各伸臂長度之荷重點 = 各作業半徑下應力比 ≦ 1 之最大荷重
   （捨去至 10 kg、隨半徑增加不增加）；半徑自最大起伏角至伸臂水平。最終荷重表由 S4 再與安定度取小值。 */
let _hubC = null, _hubT = 0;
function hubCase() { const t = Date.now(); if (t - _hubT > 1000) { try { _hubC = JSON.parse(localStorage.getItem('hub')) || null; } catch (e) { _hubC = null; } _hubT = t; } return _hubC; }
/* 斷面尺寸取自主控台 S1-3（數值欄轉數字） */
function syncSecFromHub() {
  if (!NOCHART()) return false;
  const bs = (hubCase() || {}).boomSec; if (!bs || !Array.isArray(bs.secs)) return false;
  const num = v => { const x = parseFloat(v); return isFinite(x) ? x : null; };
  const before = JSON.stringify([S.shape, S.booms.map(b => b.sec)]);
  if (bs.shape) S.shape = bs.shape;
  S.booms.forEach((b, k) => {
    const x = bs.secs[k]; if (!x) return;
    ['B', 'H', 'tt', 'ts', 'tb', 'at', 'ab', 'dtL', 'dtT', 'dbL', 'dbT'].forEach(f => { if (x[f] !== undefined) b.sec[f] = num(x[f]); });
    b.sec.fold = !!x.fold;
  });
  const changed = JSON.stringify([S.shape, S.booms.map(b => b.sec)]) !== before;
  if (changed) save();
  return changed;
}
function NOCHART() { if (!window.CASE_ID || S.src !== 'self') return false; const c = hubCase(); return !!c && c.hasChart === false; }
function autoRowsFromStrength() {
  let fin = null; try { fin = JSON.parse(localStorage.getItem('final_chart')); } catch (e) {}
  const lim = fin ? null : strengthLimits(compute()); if (!fin && !lim) return false;
  const c = hubCase(), thM = Number(c && c.stab && c.stab.thetaM) || 78, a = isNum(S.design.rOff) ? S.design.rOff : 0;
  const cap = (parseFloat(c && c.crane && c.crane.orig_capacity_t) || 0) * 1000 || Infinity;   // 原吊升荷重上限
  let changed = false;
  S.stages.forEach((st, s) => {
    if (!(st.len > 0)) return;
    if (fin) {   // S4 最終荷重表（已含伸臂強度、安定度、原吊升荷重）
      const ci = fin.booms.findIndex(b => Math.abs(Number(b) - st.len) < 0.005);
      const rows = ci < 0 ? [] : fin.cells.map(row => row[ci]).filter(Boolean).map(([W, R]) => [W, R, null]);
      if (!rows.length) rows.push([null, null, null]);
      if (JSON.stringify(rows) !== JSON.stringify(st.rows)) { st.rows = rows; changed = true; }
      return;
    }
    const L = lim.stages[s]; if (!L) return;
    const rMax = Math.floor((st.len - a) * 10) / 10;
    const rMin = Math.max(0.5, Math.ceil((st.len * Math.cos(thM * RAD) - a) * 2) / 2);
    const grid = [];
    for (let r = rMin; r < 4 - 1e-9 && r < rMax - 1e-9; r += 0.5) grid.push(+r.toFixed(2));
    for (let r = Math.max(4, Math.ceil(rMin)); r < rMax - 0.05; r += 1) grid.push(r);
    grid.push(rMax);
    const n = L.W.length - 1, rows = []; let prev = Infinity;
    grid.forEach(r => {
      const i = r / lim.dR;
      let W = Math.min(L.W[Math.min(n, Math.floor(i + 1e-9))], L.W[Math.min(n, Math.ceil(i - 1e-9))]);
      W = Math.min(prev, cap, Math.floor(W / 5) * 5); prev = W;
      if (W > 0) rows.push([W, r, null]);
    });
    if (!rows.length) rows.push([null, null, null]);
    if (JSON.stringify(rows) !== JSON.stringify(st.rows)) { st.rows = rows; changed = true; }
  });
  if (changed) { S.design.thetaFromR = true; save(); }
  return changed;
}

/* ---------------- 結構性操作 ---------------- */
function blankGeo() { return { L: null, l0: null, li: S.items.map(() => null) }; }
function setN(n) {
  n = Math.max(1, Math.min(20, n | 0));
  while (S.booms.length < n) {
    const last = S.booms[S.booms.length - 1];
    const k = S.booms.length;
    const ns = last ? JSON.parse(JSON.stringify(last.sec)) : { B: 20, H: 40, tt: 0.4, ts: 0.4, tb: 0.4, at: 15, ab: 15, fold: false, dtL: 3.5, dtT: 0.3, dbL: 3.5, dbT: 0.3 };
    if (last) { ns.B = +(ns.B * 0.92).toFixed(2); ns.H = +(ns.H * 0.9).toFixed(2); }
    S.booms.push({ w: last ? last.w : 0.3, sec: ns });
    S.items.push({ name: `${boomName(k)} 重量`, G: 0, boom: k + 1 });
    S.stages.forEach(st => st.geo.forEach(g => g.li.push(null)));
    S.stages.forEach(st => st.geo.push(blankGeo()));
    const minLen = S.stages.length ? Math.min(...S.stages.map(s => s.len)) : 5;
    S.stages.push({ len: +(Math.max(minLen - 2, 1)).toFixed(2), rows: [[1000, 3, 60]], geo: S.booms.map(() => blankGeo()) });
    const E = S.est, lx = E.X.length ? E.X[E.X.length - 1] : 0;
    E.Xsec.push(lx - STOP_PLATE); E.X.push(lx + 240); E.Xpin += 240;
    E.items.push({ name: `${boomName(k)} 重量`, G: 0, kind: 'boom', boom: k + 1, cyl: 1, X: null });
  }
  while (S.booms.length > n) {
    const k = S.booms.length - 1;
    S.booms.pop();
    S.stages.forEach(st => st.geo.pop());
    for (let i = S.items.length - 1; i >= 0; i--) if (Number(S.items[i].boom) === k + 1) delItem(i);
    S.stages.pop();
    const E = S.est;
    E.Xpin -= E.X[k] - (E.X[k - 1] || 0); E.X.pop(); E.Xsec.pop();
    E.items = E.items.filter(it => !(it.kind === 'boom' && Number(it.boom) === k + 1));
    if (E.m > n) E.m = n;
  }
  S.ui.det = { s: 0, r: 0, k: 0 };
}
function addItem() { S.items.push({ name: '新增重量項目', G: 0, boom: 0 }); S.stages.forEach(st => st.geo.forEach(g => g.li.push(null))); }
function delItem(i) { S.items.splice(i, 1); S.stages.forEach(st => st.geo.forEach(g => g.li.splice(i, 1))); }

/* ---------------- 繪製：伸臂側視示意（重心位置） ---------------- */
function drawStage(s, C, mk = 'ar2') {
  const T = C.eff.tables[s], est = C.eff.mode === 'est', N = S.booms.length;
  if (!T[0].active || !isNum(T[0].L)) return `<p class="note">需有斷面 ${secName(0)} 的 L 才能繪製示意圖。</p>`;
  const es = est ? C.eff.st[s] : null;
  // 位置：est → 以旋轉中心為 0；oem → 以斷面 A 為 0
  const secX = k => est ? es.xsec[k] : T[0].L - T[k].L;
  const pinX = est ? es.xpin : T[0].L;
  const itemsX = C.eff.items.map((it, i) => est ? es.itemX[i] : (isNum(T[0].li[i]) ? T[0].li[i] : NaN));
  const act = []; for (let k = 0; k < N; k++) if (T[k].active) act.push(k);
  const ends = act.map((k, i) => act[i + 1] != null ? secX(act[i + 1]) : secX(k) + Math.max(T[k].l0 || 0, T[k].L));
  const x0 = est ? 0 : 0, x1 = Math.max(pinX, ...ends, ...itemsX.filter(isNum));
  const W = 1100, ml = est ? 40 : 30, mr = 40, sx = (W - ml - mr) / Math.max(x1 - x0, 1);
  const maxH = Math.max(...C.geo.map(g => g.err ? 0 : g.H), 1), hs = Math.min(56 / maxH, 1.4);
  const yc = 92, P = x => ml + (x - x0) * sx;
  let o = `<svg viewBox="0 0 ${W} 190" font-family="Arial,'Microsoft JhengHei',sans-serif"><defs><marker id="${mk}" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1.5 L10,5 L0,8.5 z" fill="#333"/></marker></defs>`;
  if (est) {
    const h0 = (C.geo[0].err ? 20 : C.geo[0].H) * hs;
    o += `<rect x="${P(0)}" y="${yc - h0 / 2}" width="${(secX(0)) * sx}" height="${h0}" fill="#e8eef6" stroke="#34404f"/>`;
    o += `<circle cx="${P(0)}" cy="${yc}" r="5" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="${P(0)}" y="${yc + h0 / 2 + 22}" font-size="10.5" text-anchor="middle">旋轉中心 0</text>`;
  }
  act.forEach((k, i) => {
    const a = secX(k), b = ends[i];
    const hh = (C.geo[k].err ? 20 : C.geo[k].H) * hs;
    o += `<rect x="${P(a)}" y="${yc - hh / 2}" width="${(b - a) * sx}" height="${hh}" fill="#e8eef6" stroke="#34404f" stroke-width="1"/>`;
    o += `<line x1="${P(a)}" y1="${yc - hh / 2 - 12}" x2="${P(a)}" y2="${yc + hh / 2 + 12}" stroke="var(--cl)" stroke-width="1.2"/>`;
    o += `<text x="${P(a)}" y="${yc + hh / 2 + 24}" font-size="11" text-anchor="middle" fill="var(--cl)" font-weight="700">${LET[k]}</text>`;
    if (est) o += `<text x="${P(a)}" y="${yc + hh / 2 + 36}" font-size="9" text-anchor="middle" fill="var(--cl)">${f(a, 1)}</text>`;
  });
  o += `<circle cx="${P(pinX)}" cy="${yc}" r="5" fill="#fff" stroke="#111"/><line x1="${P(pinX)}" y1="${yc + 5}" x2="${P(pinX)}" y2="${yc + 75}" stroke="#111" marker-end="url(#${mk})"/>
    <text x="${P(pinX) + 6}" y="${yc + 70}" font-size="11">W</text>`;
  if (est) o += `<text x="${P(pinX)}" y="${yc - 14}" font-size="9" text-anchor="middle">${f(pinX, 1)}</text>`;
  C.eff.items.forEach((it, i) => {
    const x = itemsX[i]; if (!isNum(x)) return;
    const y0 = yc - 56 + (i % 3) * 10;
    o += `<line x1="${P(x)}" y1="${y0}" x2="${P(x)}" y2="${yc - 4}" stroke="#555" stroke-width=".8" marker-end="url(#${mk})"/><text x="${P(x)}" y="${y0 - 3}" font-size="10" text-anchor="middle">G${i + 1}</text>`;
  });
  o += `<text x="${ml}" y="184" font-size="10.5" fill="#5b6675">${est ? '位置以伸臂最底端旋轉中心為基準點（cm）' : `以斷面 ${secName(0)} 為原點，Gi 位置取 ${secName(0)} 欄之 ℓi`}</text></svg>`;
  return o;
}

/* ---------------- 吊升荷重表（矩陣） ---------------- */
function chartRadii() {
  const txt = (S.chart.radii || '').trim();
  if (txt) { const v = txt.split(/[,，\s]+/).map(Number).filter(x => isNum(x) && x > 0); if (v.length) return [...new Set(v)].sort((a, b) => a - b); }
  const all = S.stages.flatMap(st => st.rows.map(r => r[1])).filter(isNum);
  if (!all.length) return [];
  const lo = Math.max(0.5, Math.floor(Math.min(...all) * 2) / 2), hi = Math.round(Math.max(...all));
  const out = [];
  for (let r = lo; r < 4 - 1e-9; r += 0.5) out.push(+r.toFixed(2));
  for (let r = Math.max(4, Math.ceil(lo)); r <= hi + 1e-9; r += 1) out.push(r);
  return out;
}
function loadChartHTML() {
  const rows = chartRadii();
  const cols = S.stages.map((st, s) => s).filter(s => isNum(S.stages[s].len)).sort((a, b) => S.stages[a].len - S.stages[b].len);
  const nearest = R => { let bi = 0; rows.forEach((r, i) => { if (Math.abs(r - R) < Math.abs(rows[bi] - R) - 1e-9) bi = i; }); return bi; };
  const fmtR = r => String(+Number(r).toFixed(3));
  const grid = cols.map(s => {
    const pts = S.stages[s].rows.filter(r => isNum(r[0]) && isNum(r[1])).map(r => ({ W: r[0], R: r[1] })).sort((a, b) => a.R - b.R);
    const cell = rows.map(() => null);
    if (!pts.length || !rows.length) return cell;
    const iMin = nearest(pts[0].R), iMax = nearest(pts[pts.length - 1].R);
    const asg = {}; pts.forEach(p => { const i = nearest(p.R); if (!asg[i] || p.R > asg[i].R) asg[i] = p; });
    rows.forEach((r, i) => {
      if (i < iMin) { cell[i] = { x: true }; return; }
      if (i > iMax) return;
      const a = asg[i];
      if (a && Math.abs(a.R - r) > 1e-6) { cell[i] = { W: a.W, note: fmtR(a.R) }; return; }
      const p = pts.find(q => q.R >= r - 1e-9);
      cell[i] = p ? { W: p.W } : (a ? { W: a.W } : null);
    });
    return cell;
  });
  let h = `<div class="lc-title"><b>${esc(S.chart.title || '吊升荷重表')}</b><span>單位：<b>kg</b></span></div>
  <table class="lc"><thead><tr><th class="corner" rowspan="2"><span class="a">吊桿長度 (m)</span><span class="b">作業半徑 (m)</span></th><th colspan="${cols.length}">吊桿長度（m）</th></tr>
  <tr>${cols.map(s => `<th>${fmtR(S.stages[s].len)}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach((r, i) => {
    h += `<tr><td class="r">${fmtR(r)}</td>${grid.map(c => { const v = c[i]; if (!v) return '<td></td>'; if (v.x) return '<td class="x"></td>'; return `<td>${f(v.W, 0)}${v.note ? `<small>(${v.note}m)</small>` : ''}</td>`; }).join('')}</tr>`;
  });
  return h + '</tbody></table>';
}

/* 列印分頁：依序將伸臂長度段分組，每組列數不超過 max（單段超過者自成一組） */
function pageGroups(counts, max) {
  const out = []; let cur = [], n = 0;
  counts.forEach((c, i) => { if (cur.length && n + c > max) { out.push(cur); cur = []; n = 0; } cur.push(i); n += c; });
  if (cur.length) out.push(cur);
  return out;
}

/* 申請案模式：以主控台 S1-3 荷重表（伸臂長度、荷重點）重建荷重性能表（同主控台 S3 起始資料之規則） */
function loadChartFromHub() {
  let c = null; try { c = JSON.parse(localStorage.getItem('hub')); } catch (e) {}
  const num = v => { const x = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(x) ? x : NaN; };
  if (!c) return alert('讀不到申請案資料。');
  const ch = c.hasChart && c.origChart && (c.origChart.booms || []).length ? c.origChart : null;
  let lens = ((c.boom && c.boom.stages_m) || []).map(num).filter(x => x > 0);
  if (!lens.length && ch) lens = ch.booms.map(num).filter(x => x > 0);
  if (!lens.length) return alert('S1-3 尚未建立荷重性能表或伸臂各段長度。');
  const stages = lens.map(L => {
    const ci = ch ? ch.booms.findIndex(b => Math.abs(num(b) - L) < 0.02) : -1, rows = [];
    if (ci >= 0) ch.radii.forEach((r, ri) => {
      const m = /^\s*([\d.]+)\s*(?:[（(]\s*([\d.]+)\s*m?\s*[)）])?/.exec(String((ch.cells[ri] || [])[ci] || ''));
      if (m && num(m[1]) > 0) rows.push([num(m[1]), m[2] ? num(m[2]) : num(r), null]);
    });
    return { len: L, rows: rows.length ? rows : [[null, null, null]] };
  }).reverse();   // 由全伸排到全縮
  if (!confirm(`以 S1-3 帶入 ${stages.length} 種伸臂長度、共 ${stages.reduce((a, x) => a + x.rows.length, 0)} 個荷重點？\n目前的伸臂長度與荷重點將被取代。`)) return;
  if (stages.length !== S.booms.length) setN(stages.length);
  stages.forEach((st, s) => { S.stages[s].len = st.len; S.stages[s].rows = st.rows; });
  S.design.thetaFromR = true;
  S.ui.det = { s: 0, r: 0, k: 0 };
}

/* 自行計算之起始資料：伸臂長度、荷重點取自 S1 荷重性能表；位置、重量取自 S2-5（推估值） */
function seedSelf(sd) {
  const n = sd.stages.length;
  S = newState(dataBlank(n), 'self', 'est', sd.model || '');
  S.stages = sd.stages.map(st => ({ len: st.len, rows: st.rows.length ? st.rows.map(r => [r[0], r[1], null]) : [[null, null, null]], geo: [] }));
  fillGeo(S);
  S.design.thetaFromR = true;   // 原廠荷重表無伸臂角：由作業半徑反算
  const E = S.est;
  if (sd.X && sd.X.length === n) {
    E.X = sd.X.slice(); E.Xsec = sd.X.map((_, k) => xsecDefault(sd.X, k, n)); E.Xpin = sd.X[n - 1];
  }
  E.m = Math.max(1, Math.min(n, sd.m || 2));
  E.items = [
    ...Array.from({ length: n - 1 }, (_, k) => ({ name: `伸臂(${k + 2}) 重量`, G: isNum(sd.segW && sd.segW[k + 1]) ? sd.segW[k + 1] : null, kind: 'boom', boom: k + 2, cyl: 1, X: null })),
    ...Array.from({ length: E.m }, (_, c) => ({ name: `伸縮油壓缸 ${c + 1}`, G: isNum(sd.cylW && sd.cylW[c]) ? sd.cylW[c] : null, kind: 'cyl', boom: 0, cyl: c + 1, X: null }))
  ];
  if (sd.w) S.booms.forEach((b, k) => { if (isNum(sd.w[k])) b.w = sd.w[k]; });
}
/* 自行計算之「依 S1／S2 重新帶入」：只覆寫來自主控台的資料（伸臂長度、荷重點、油壓缸支數、重量），
   斷面尺寸、設計條件、各部位置等使用者輸入保留 */
function mergeSelf(sd) {
  const n = sd.stages.length;
  if (n !== S.booms.length) setN(n);
  sd.stages.forEach((st, s) => { S.stages[s].len = st.len; S.stages[s].rows = st.rows.length ? st.rows.map(r => [r[0], r[1], null]) : [[null, null, null]]; });
  S.design.thetaFromR = true;
  const E = S.est;
  E.m = Math.max(1, Math.min(n, sd.m || E.m || 2));
  // 位置：伸臂頭端 X 一律依 S1-3 伸臂長度更新；斷面位置若仍為舊預設值則隨之重算，自行輸入者保留
  if (sd.X && sd.X.length === n) {
    const oldX = E.X.slice();
    fixOldXsec(E);
    for (let k = 1; k < n; k++) if (isNum(oldX[k - 1]) && isNum(E.Xsec[k]) && Math.abs(E.Xsec[k] - xsecDefault(oldX, k, n)) < 0.05) E.Xsec[k] = null;
    E.X = sd.X.slice();
    for (let k = 0; k < n; k++) if (!isNum(E.Xsec[k])) E.Xsec[k] = xsecDefault(E.X, k, n);
    fixXpin(E);
  }
  // 重量：一律以 S2-5 為準（原廠／實測值或推估值皆覆寫；本函式只在使用者按「依 S1／S2 重新帶入」時執行）
  const putG = (it, v) => { if (isNum(v)) it.G = v; };
  const others = E.items.filter(it => it.kind === 'att');
  const booms = Array.from({ length: n - 1 }, (_, k) => E.items.find(it => it.kind === 'boom' && Number(it.boom) === k + 2) || { name: `伸臂(${k + 2}) 重量`, G: null, kind: 'boom', boom: k + 2, cyl: 1, X: null });
  booms.forEach((it, k) => putG(it, sd.segW && sd.segW[k + 1]));
  const cyls = Array.from({ length: E.m }, (_, c) => E.items.find(it => it.kind === 'cyl' && Number(it.cyl) === c + 1) || { name: `伸縮油壓缸 ${c + 1}`, G: null, kind: 'cyl', boom: 0, cyl: c + 1, X: null });
  cyls.forEach((it, c) => putG(it, sd.cylW && sd.cylW[c]));
  E.items = [...booms, ...cyls, ...others];
  S.ui.det = { s: 0, r: 0, k: 0 };
}
function applySeed() {
  if (!window.CASE_ID) return;
  let sd = null; try { sd = JSON.parse(localStorage.getItem('boomStrength_seed')); } catch (e) {}
  if (!sd || !sd.id || sd.id === S.seedId) return;
  if (sd.machine && MACHINES[sd.machine]) pickMachine(sd.machine);
  else if (sd.stages && sd.stages.length && S.src === 'self') mergeSelf(sd);
  else if (sd.stages && sd.stages.length) seedSelf(sd);
  else startSelf('');
  S.seedId = sd.id;
  if (sd.title) S.project.title = sd.title;
  if (sd.model && !isDb()) S.project.model = sd.model;
  save();
}
applySeed();
syncSecFromHub();
const hm = location.hash.match(/^#(URA506WY)/);   // 例：#URA506WY 直接開啟該機具（供外部系統連結）
if (hm) pickMachine(hm[1]);
renderAll();
if (VIEW_DOC) {
  document.body.classList.add('doc');
  if (S.src) openPreview();
  else { document.body.classList.add('preview'); $('#print').innerHTML = '<div class="doc-empty">尚未建立伸臂強度計算資料，請回主控台 <b>S3 伸臂強度計算</b> 輸入。</div>'; }
} else if (/#print$/.test(location.hash) && S.src) openPreview();
</script>
